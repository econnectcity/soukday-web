name: Deploy Customer Web to new.soukday.ca

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to new.soukday.ca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export & Process Assets
        run: npm run build
        env:
          NEXT_PUBLIC_SEO: "false"
          NEXT_PUBLIC_API_URL: https://admin.soukday.ca
          NEXT_PUBLIC_BASE_URL: https://new.soukday.ca

      - name: Sync to new.soukday.ca via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '67.215.11.226' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 120000
